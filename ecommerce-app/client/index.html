<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storefront</title>
  <meta name="description" content="A clean, modern e-commerce storefront. Browse products, manage your cart, and track orders.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Roboto+Mono:wght@400;500&family=Spline+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header glassmorphic">
    <div class="container header-inner">
      <a href="#/" class="logo" id="site-logo">Storefront</a>
      <nav class="main-nav" id="main-nav" aria-label="Main navigation">
        <a href="#/" id="nav-shop">Shop</a>
        <a href="#/orders" id="nav-orders" class="auth-only">Orders</a>
        <a href="#/cart" id="nav-cart" class="cart-link">
          Cart<span id="cart-count" class="cart-count" hidden>0</span>
        </a>
        <a href="#/login" id="nav-login" class="guest-only">Log in</a>
        <a href="#/register" id="nav-register" class="guest-only">Register</a>
        <a href="#/profile" id="nav-profile" class="auth-only">Profile</a>
        <button id="logout-btn" class="auth-only link-btn">Log out</button>
      </nav>
    </div>
  </header>

  <main id="app" class="container view" role="main"></main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>Storefront &mdash; demo project</span>
      <span>&copy; <span id="footer-year"></span></span>
    </div>
  </footer>

  <script>document.getElementById('footer-year').textContent = new Date().getFullYear();</script>

  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/router.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/product.js"></script>
  <script src="js/pages/cart.js"></script>
  <script src="js/pages/checkout.js"></script>
  <script src="js/pages/auth.js"></script>
  <script src="js/pages/orders.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
